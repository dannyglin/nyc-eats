<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f0f9ff">
  <meta name="description" content="Spin the Meal Machine to pick your next NYC restaurant.">
  <title>NYC Eats · Meal Machine</title>
  <link rel="icon" href="public/meal-machine.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg class="symbols" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="clock" viewBox="0 0 24 24"><path d="M3 11a9 9 0 1 1 2 7M3 5v6h6m3-4v6l3 2"/></symbol>
    <symbol id="spin-icon" viewBox="0 0 24 24"><path d="M4 10a8 8 0 0 1 14-4l2 2M20 3v5h-5M20 14a8 8 0 0 1-14 4l-2-2m5 0H4v5"/></symbol>
    <symbol id="pin" viewBox="0 0 24 24"><path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2"/></symbol>
    <symbol id="fork" viewBox="0 0 24 24"><path d="M4 3v6a3 3 0 0 0 6 0V3M7 3v18m11 0V3c-3 2-4 5-4 10h4"/></symbol>
    <symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12m0-12L6 18"/></symbol>
  </svg>
  <header class="masthead">
    <div class="brand"><img src="public/arcade-food/burger.png" alt=""><span>NYC <b>EATS</b></span></div>
    <button type="button" class="history-button" id="open-history"><svg class="icon" aria-hidden="true"><use href="#clock"/></svg>Recent picks</button>
  </header>
  <main class="stage">
    <img class="city-scene" src="public/arcade-city.png" alt="">
    <div class="game">
      <section class="cabinet" id="machine" aria-labelledby="game-title">
        <div class="marquee">
          <div class="marquee-face">
            <i class="spark" aria-hidden="true"></i>
            <h1 id="game-title">Meal Machine</h1>
            <i class="spark" aria-hidden="true"></i>
          </div>
        </div>
        <div class="machine-body">
          <div class="bezel">
            <div class="display-heading"><span class="grille"></span><span id="machine-status" role="status">Loading</span><span class="grille"></span></div>
            <div class="reels" aria-hidden="true">
              <div class="reel"><div class="strip"><div class="tile"><img src="public/arcade-food/pizza.png" alt=""><span>Pizza</span></div></div></div>
              <div class="reel"><div class="strip"><div class="tile"><img src="public/arcade-food/burger.png" alt=""><span>Burger</span></div></div></div>
              <div class="reel"><div class="strip"><div class="tile"><img src="public/arcade-food/ramen.png" alt=""><span>Ramen</span></div></div></div>
            </div>
          </div>
          <div class="deck">
            <span class="speaker" aria-hidden="true"></span>
            <button type="button" class="spin-button" id="spin" disabled><svg class="icon" aria-hidden="true"><use href="#spin-icon"/></svg><span id="spin-label">Spin to pick</span></button>
            <span class="speaker" aria-hidden="true"></span>
          </div>
        </div>
        <div class="lever" aria-hidden="true"><i></i></div>
      </section>
      <div class="filter-bar" role="group" aria-label="Restaurant filters">
        <label><svg class="icon" aria-hidden="true"><use href="#pin"/></svg><span class="visually-hidden">Borough</span><select id="borough" disabled><option value="">All boroughs</option></select></label>
        <label><svg class="icon" aria-hidden="true"><use href="#fork"/></svg><span class="visually-hidden">Cuisine</span><select id="cuisine" disabled><option value="">All cuisines</option></select></label>
      </div>
      <p class="feed-message" id="feed-message" hidden><span id="feed-text"></span> <button type="button" id="retry" hidden>Try again</button></p>
      <noscript>Enable JavaScript to spin the Meal Machine.</noscript>
    </div>
  </main>
  <footer><span class="location"><svg class="icon" aria-hidden="true"><use href="#pin"/></svg>New York City</span><a href="https://data.cityofnewyork.us/Health/DOHMH-New-York-City-Restaurant-Inspection-Results/43nn-pn8j" target="_blank" rel="noopener noreferrer">NYC Open Data <span aria-hidden="true">↗</span></a></footer>
  <dialog id="result" aria-labelledby="result-name">
    <div class="dialog-top"><span>Your restaurant</span><button type="button" aria-label="Close restaurant details" class="close"><svg class="icon" aria-hidden="true"><use href="#close"/></svg></button></div>
    <div class="dialog-content"><img class="prize" id="prize" alt=""><h2 id="result-name"></h2><p id="result-details"></p><p class="address"><svg class="icon" aria-hidden="true"><use href="#pin"/></svg><span id="result-address"></span></p>
    <div class="actions"><a id="maps" class="primary" target="_blank" rel="noopener noreferrer">View on map ↗</a><button type="button" id="reroll">Spin again</button></div></div>
  </dialog>
  <dialog id="recent" aria-labelledby="recent-title">
    <div class="dialog-top"><h2 id="recent-title">Recent picks</h2><button type="button" aria-label="Close recent picks" class="close"><svg class="icon" aria-hidden="true"><use href="#close"/></svg></button></div>
    <div class="dialog-content"><p id="empty-history">Spin the machine to make your first pick.</p><ol id="history"></ol></div>
  </dialog>
  <script src="public/picker-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
